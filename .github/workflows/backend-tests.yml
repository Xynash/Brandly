name: backend-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brandly
          POSTGRES_PASSWORD: brandly
          POSTGRES_DB: brandly
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U brandly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://brandly:brandly@127.0.0.1:5433/brandly
      TEST_DATABASE_URL: postgresql+psycopg://brandly:brandly@127.0.0.1:5433/brandly_test
      LLM_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - name: Guard against committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked by git"; exit 1
          fi
          if git grep -nE 'GEMINI_API_KEY=.+' -- . ':(exclude).github'; then
            echo "An API key value is committed"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

      - name: Migrations match the models
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
